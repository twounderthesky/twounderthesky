name: Build and Deploy Jekyll Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: ./source
      
      - name: Install dependencies
        working-directory: ./source
        run: bundle install
      
      - name: Configure Jekyll with secrets
        working-directory: ./source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAILCHIMP_URL: ${{ secrets.MAILCHIMP_URL }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            sed -i "s|YOUR_SUPABASE_URL_HERE|$SUPABASE_URL|g" _config.yml
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            sed -i "s|YOUR_SUPABASE_ANON_KEY_HERE|$SUPABASE_ANON_KEY|g" _config.yml
          fi
          if [ -n "$MAILCHIMP_URL" ]; then
            MAILCHIMP_ESCAPED=$(printf '%s' "$MAILCHIMP_URL" | sed -e 's/[\/&]/\\&/g')
            sed -i "s|YOUR_MAILCHIMP_FORM_URL_HERE|$MAILCHIMP_ESCAPED|g" _config.yml
          fi
      
      - name: Build Jekyll site
        working-directory: ./source
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build -d ../_site
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

