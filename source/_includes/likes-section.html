<!-- Likes Section -->
<section class="post-likes-section" aria-label="Post likes and sharing">
    <div class="post-likes-content">
        <div class="like-count-display" role="status" aria-live="polite">
            <span class="like-count-icon" aria-hidden="true">❤️</span>
            <span id="like-count" class="like-count-number">0</span>
            <span class="like-count-label">people liked this</span>
        </div>
        <div class="post-likes-actions">
            <button id="like-button" class="like-button" data-post-slug="{{ page.url | remove_first: '/' | replace: '/', '-' | replace: '.html', '' }}" aria-label="Like this post" aria-pressed="false">
                <span class="like-button-icon" aria-hidden="true">♡</span>
                <span class="like-button-text">Like</span>
            </button>
            <button id="share-button" class="share-button" type="button" aria-label="Share this post" data-share-url="{{ site.url }}{{ site.baseurl }}{{ page.url | remove_first: '/' }}">
                <span class="share-button-icon" aria-hidden="true">🔗</span>
                <span class="share-button-text">Share</span>
            </button>
        </div>
        <p id="share-feedback" class="share-feedback" role="status" aria-live="polite"></p>
    </div>
</section>

    font-weight: 600;
