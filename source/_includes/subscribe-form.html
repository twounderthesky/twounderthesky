<form method="post" class="mailchimp-subscribe-form" data-mailchimp-url="{{ site.mailchimp_url }}">
    <div class="form-group">
        <input class="subscribe-email" type="email" name="email" placeholder="{{ include.placeholder | default: 'youremail@example.com' }}" required />
    </div>
    <button class="" type="submit" {% unless site.subscribers %}disabled{% endunless %}>
        <span>Subscribe</span>
    </button>
</form>
